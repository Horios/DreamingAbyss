name: Enhancement effects v0.183
on:
  push:
    branches: ['feature/v0.183-enhancement-effects']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify requested experimental version and unchanged balance
        run: |
          node -e "if(require('./data/preview-version.json').version!=='v0.183')throw Error('Expected v0.183')"
          git diff --exit-code ad05618 -- data/balance.json data/balance
          node --check js/ui/loot-effects.js
          node --check js/ui/enhancement-effects.js
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Enhancement result, timing, costs and mobile regression tests
        run: >-
          node --test --test-concurrency=2
          tests/enhancement-effects.test.cjs tests/enhancement-effects.browser.test.cjs
          tests/forge-equipped-runtime.test.cjs tests/loot-effects.test.cjs
          tests/loot-effects.browser.test.cjs tests/preview-version.test.cjs
      - name: Save enhancement and loot visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enhancement-effects-v0183
          path: |
            /tmp/enhance-*.png
            /tmp/loot-*.png
          if-no-files-found: ignore
