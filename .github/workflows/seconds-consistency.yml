name: Seconds consistency branch regression
on:
  push:
    branches: [fix/seconds-data-consistency-20261103]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seconds-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Clearing skills, seconds log and preview version
        run: node --test tests/initial-clearing-skills.test.cjs tests/preview-version.test.cjs
